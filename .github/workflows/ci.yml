name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
  probe:
    name: RTF probe (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build probe
        working-directory: MacProbe
        run: swift build -c release
      - name: Verify RTF table output
        working-directory: MacProbe
        timeout-minutes: 5
        run: .build/release/rtfprobe --verify
      - name: Upload probe binary
        uses: actions/upload-artifact@v4
        with:
          name: rtfprobe
          path: MacProbe/.build/release/rtfprobe
